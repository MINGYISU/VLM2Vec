Country211:
    query:
        rephrased_1: "Identify the country depicted in the image"
        rephrased_2: "Which country does this image represent?"
        rephrased_3: "From the image, can you tell which country it is?"
        short_1: "Which country?"
        short_2: "Name the country shown"
        short_3: "Country name?"
        long_1: "Taking into account the diverse and potentially subtle features present within the image, including but not limited to cultural, geographical, and architectural elements, can you deduce with reasoned analysis which country is most likely depicted, even if some clues are ambiguous or overlapping with other nations?"
        long_2: "This image appears to showcase a specific country, yet the visual cues may be nuanced or open to interpretation; please provide a detailed classification of the nation shown, explaining your reasoning and considering possible confounding factors that might make identification challenging."
        long_3: "By thoroughly evaluating all elements present in the image—such as landmarks, attire, natural scenery, and any implicit contextual hints—can you logically infer which country is depicted, especially in cases where the evidence might point to multiple plausible options?"
        distractor_1: "Did you know that some countries have multiple time zones, which can affect daily life and business operations? Now, identify the country in the image."
        distractor_2: "Many nations share similar architectural styles due to historical influences, making visual identification tricky. Please name the country shown."
        distractor_3: "Tourism can introduce foreign elements into local culture, sometimes blending traditions. Which country is depicted here?"

