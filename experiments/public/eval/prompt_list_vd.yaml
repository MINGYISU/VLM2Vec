    short_1: "Infographic QA"
    short_2: "Answer from infographic"
    short_3: "Visual info answer"
    long_1: "You are shown an infographic that combines text, charts, icons, and other design elements. Identify the part of the infographic that is relevant to the question and use it to compute or retrieve the answer."
    long_2: "Pay attention to legends, labels, and annotations that explain what each visual element represents. Use those cues to understand the data and relationships needed to answer the question correctly."
    long_3: "If the question requires comparing values, following a process, or combining multiple pieces of information from the infographic, perform that reasoning step by step and then provide a concise final answer."
    distractor_1: "Infographics often include extra facts or decorative art that are not needed to answer the question. Ignore visually attractive but irrelevant regions and focus only on the informative parts."
    distractor_2: "Be careful to match the correct units, categories, and colors in the legend with the corresponding elements in the graphic before deciding on an answer."
    distractor_3: "Some values may be encoded indirectly (for example via bar length or icon counts). Interpret these encodings correctly rather than guessing from rough impressions."
  tqt: "Answer the question by carefully reading and interpreting the infographic image."

ViDoRe_tabfquad:
