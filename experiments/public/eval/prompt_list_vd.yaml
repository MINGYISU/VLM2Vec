    rephrased_1: "Answer the question using the data in the table shown in the document."
    rephrased_2: "From the table on this page, determine the correct answer to the question."
    rephrased_3: "Use the rows and columns of the table to find the answer to the question."
    short_1: "Table QA"
    short_2: "Answer from table"
    short_3: "Tabular answer"
    long_1: "You are given a document image containing one or more tables. Identify the relevant table and locate the correct row and column entries needed to answer the question exactly."
    long_2: "Pay careful attention to table headers, units, and cell alignments, and use them to interpret the values correctly. If the question involves a specific category or condition, find the matching row or column before reading off the value."
    long_3: "If the answer requires aggregating or comparing multiple cells (such as computing a difference or selecting a maximum), perform the necessary reasoning using only the data presented in the table."
    distractor_1: "Text outside the table may provide context but the numerical or categorical answer usually comes directly from the table cells. Focus on the tabular structure when retrieving the answer."
    distractor_2: "Similar row or column names can lead to confusion. Double check that you are using the exact label mentioned in the question before extracting a value."
    distractor_3: "Some tables may be split across multiple sections or include subtotals. Make sure you select the correct figure rather than a subtotal, total, or unrelated cell."
  tqt: "Use only the data in the table on the page to answer the question accurately."

