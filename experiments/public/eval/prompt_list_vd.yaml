    short_3: "TatDQA response"
    long_1: "You are given a document that may contain explanatory text and one or more tables. Identify which parts of the text and which table cells are relevant to the question, then integrate them to derive the correct answer."
    long_2: "Some questions require understanding of how a table is described in the text (for example which subset of rows applies). Use the text to interpret the table correctly, and then retrieve or compute the requested value."
    long_3: "If solving the question needs multi-step reasoning—such as filtering entries, applying conditions, and then aggregating results—carry out these steps using only the information within the document and answer succinctly."
    distractor_1: "Tables may include many columns that are irrelevant to the question. Focus only on those dimensions that the text and question highlight."
    distractor_2: "Narrative text can specify conditions like time ranges or categories that restrict which rows in the table are applicable. Apply these conditions carefully before reading off values."
    distractor_3: "Avoid using external world knowledge; rely solely on the combination of document text and table data to reach your answer."
