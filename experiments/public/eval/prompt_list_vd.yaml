ViDoRe_arxivqa:
  qry:
    rephrased_1: "Using the content of the arXiv paper page, what is the correct answer to the question?"
    rephrased_2: "Read the scientific article page and provide the answer to the given question."
    rephrased_3: "From the information on this arXiv document page, determine the answer to the question."
    short_1: "Answer from paper"
    short_2: "ArXiv page answer"
    short_3: "Scientific QA"
    long_1: "You are shown a page from a scientific article (similar to an arXiv preprint). Carefully read the text, formulas, figures, and captions on this page and then answer the question using only the information that appears here. Provide a concise answer phrase."
    long_2: "Treat the image as a single page of a research paper with dense technical content. Identify the region that is relevant to the question—such as the abstract, body text, equations, or figure descriptions—and extract or infer the answer directly from that content."
    long_3: "If multiple sections on the page appear related, integrate the information logically before answering. Do not rely on external knowledge beyond what is shown on the page; base your response strictly on the scientific document image."
    distractor_1: "Scientific papers often contain background or related work that is not needed to answer a specific question. Ignore irrelevant sections and use only the parts of the page that directly support your answer."
    distractor_2: "Equations, symbols, and technical terminology on arXiv can be visually dense. Focus on the portions that the question targets, such as a definition, result, or parameter value, and answer based on those."
    distractor_3: "Some questions may be answerable from a figure, table, or caption rather than the main text. Check all components of the page before deciding where the answer comes from."
  tqt: "Answer the question using only the information visible on the arXiv paper page."

ViDoRe_docvqa:
  qry:
    rephrased_1: "Answer the question using the content of the document page."
    rephrased_2: "Based on the text and layout in the document image, what is the answer?"
    rephrased_3: "Read the document page and provide the answer to the question."
    short_1: "Document QA"
    short_2: "Answer from doc"
    short_3: "Page answer"
    long_1: "You are given an image of a document page, which may contain paragraphs, headers, lists, and other layout elements. Locate the parts of the page relevant to the question and use them to derive a precise answer."
    long_2: "Treat the image as a scanned or rendered document. Read the printed or handwritten text carefully, taking into account the structure (titles, sections, bullet points, etc.), and respond with only the information required by the question."
    long_3: "If the answer requires combining information from multiple parts of the page, integrate those pieces logically before answering. Do not include extra context or explanation, just the answer itself."
    distractor_1: "Documents often contain decorative or boilerplate text such as headers, footers, or page numbers. Ignore such elements unless the question explicitly refers to them."
    distractor_2: "Some visually prominent text, like large headings, may not be relevant to the question. Focus instead on the specific section that addresses what is being asked."
    distractor_3: "Be careful not to confuse similar fields or repeated values (such as multiple dates or names). Choose the one that best matches the description in the question."
  tqt: "Use the given document image to answer the question as accurately and concisely as possible."

ViDoRe_infovqa:
